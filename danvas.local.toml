# How danvas's static page shows notes opened from a reader's own computer,
# with nothing installed and nothing uploaded:
#
#   https://danielchahine004.github.io/danvas/?local=DanielChahine004/notesmap
#
# The page runs [app] (a danvas.toml among the opened files wins), reads the
# folder or .tex file the reader picks, and follows it as they save.

[app]
entry = "notesmap.static:app"
requires = ["github:DanielChahine004/notesmap@main"]
files = ["notesmap.toml"]

[local]
# the notes' main file, when the opened files carry no notesmap.toml
main = ["main.tex", "*.tex"]

[local.write]
# added when the opened files lack it; {main} is the main file found above
"notesmap.toml" = '''
[source]
path = "{main}"
'''

[local.starter]
# "Start new notes": copied from this repo into a folder the reader chooses
"main.tex" = "src/notesmap/templates/main.tex"
"notesmap.sty" = "src/notesmap/templates/notesmap.sty"
