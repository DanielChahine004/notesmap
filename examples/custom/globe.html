<!doctype html>
<!-- A [custom] panel example: the programmes as cards on a spinning 3D globe.
     In notesmap.toml:
       [custom.globe]
       at = [3000, 4700, 3000, 3000]   # x, y, width, height on the canvas
       html = "globe.html"             # this file, relative to notesmap.toml
       frame = false                   # no card around it
       wheel = true                    # the wheel zooms the globe, not the canvas
     Drag to spin, wheel to zoom, double-click to stop or start the spin, click a card for its papers. -->
<html><head><meta charset="utf-8"><style>
html,body{margin:0;height:100%;overflow:hidden;background:transparent;font-family:system-ui,sans-serif}
#w{position:relative;width:100%;height:100%;cursor:grab;user-select:none;touch-action:none}
#w.drag{cursor:grabbing}
canvas{position:absolute;inset:0;width:100%;height:100%}
.c{position:absolute;left:0;top:0;transform-origin:50% 100%;width:170px;background:rgba(14,18,28,.92);
 color:#e8ecf4;border:1px solid #3b5ba8;border-radius:8px;padding:6px 7px 7px;font-size:11px;line-height:1.25;
 box-shadow:0 4px 14px rgba(0,0,0,.5);cursor:pointer}
.c:after{content:"";position:absolute;left:50%;bottom:-9px;width:1px;height:9px;background:#9fb6ff}
.c b{display:block;font-size:12px;margin-bottom:2px}
.c i{color:#9aa6bd;font-style:normal;display:block;margin-bottom:4px}
.c img{width:100%;height:70px;object-fit:cover;border-radius:4px;display:block}
.c ul{margin:5px 0 0;padding-left:14px;display:none}
.c.open ul{display:block}.c.open{width:240px}
.c a{color:#9fb6ff}
.n{position:absolute;right:6px;top:5px;background:#3b5ba8;border-radius:9px;padding:0 6px;font-size:10px}
</style></head><body><div id="w"><canvas id="g"></canvas></div><script>
// window.NOTES: [{key, title, place, lat, lon, thumb, papers: [{key, title, year, link, thumb}]}]
const TEXTURE = "https://cdn.jsdelivr.net/gh/DanielChahine004/notesmap@main/src/notesmap/assets/world-blue-marble.jpg";
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const w = document.getElementById("w"), cv = document.getElementById("g"), cx = cv.getContext("2d");
let lam = 40, phi = 20, zoom = 1, spin = true, tex = null, TW = 0, TH = 0, img = null, last = 0;
const R2D = 180 / Math.PI, D2R = Math.PI / 180;
const t = new Image(); t.crossOrigin = "anonymous";
t.onload = () => { const o = document.createElement("canvas"); o.width = TW = t.width; o.height = TH = t.height;
  const c = o.getContext("2d"); c.drawImage(t, 0, 0); tex = c.getImageData(0, 0, TW, TH).data; };
t.src = TEXTURE;
const cards = (window.NOTES || []).filter(g => g.lat != null).map(g => {
  const e = document.createElement("div"), thumb = g.thumb || (g.papers.find(p => p.thumb) || {}).thumb;
  e.className = "c";
  e.innerHTML = `<span class="n">${g.papers.length}</span><b>${esc(g.title.split(" – ")[0])}</b><i>${esc(g.place)}</i>` +
    (thumb ? `<img src="${thumb}">` : "") +
    `<ul>${g.papers.map(p => `<li>${p.link ? `<a href="${esc(p.link)}" target="_blank">${esc(p.title)}</a>` : esc(p.title)}</li>`).join("")}</ul>`;
  e.addEventListener("pointerdown", ev => ev.stopPropagation());
  e.addEventListener("click", ev => { if (ev.target.tagName !== "A") e.classList.toggle("open"); });
  w.appendChild(e); return { g, e };
});
// the panel can be zero-sized when this first runs (the canvas lays it out later): size every frame
let S = null, SW = 0, SH = 0;
function size() { const r = w.getBoundingClientRect();
  if (r.width < 2 || r.height < 2) return null;
  if (S && r.width === SW && r.height === SH) return S;
  SW = r.width; SH = r.height; const q = Math.min(1, 1000 / Math.min(r.width, r.height));
  cv.width = Math.round(r.width * q); cv.height = Math.round(r.height * q);
  img = cx.createImageData(cv.width, cv.height); return { q }; }
function draw(ts) {
  S = size(); if (!S) { requestAnimationFrame(draw); return; }
  const dt = last ? Math.min(ts - last, 100) : 0; last = ts;
  if (spin) lam = (lam + dt * 0.006) % 360;
  const W = cv.width, H = cv.height, R = Math.min(W, H) * 0.42 * zoom, X = W / 2, Y = H / 2;
  const sp = Math.sin(phi * D2R), cp = Math.cos(phi * D2R), d = img.data; d.fill(0);
  if (tex) {   // orthographic projection of the map picture, shaded toward the limb
    const y0 = Math.max(0, Math.floor(Y - R)), y1 = Math.min(H, Math.ceil(Y + R));
    for (let y = y0; y < y1; y++) {
      const ny = (Y - y) / R, ny2 = ny * ny; if (ny2 >= 1) continue;
      const hw = Math.sqrt(1 - ny2) * R, x0 = Math.max(0, Math.floor(X - hw)), x1 = Math.min(W, Math.ceil(X + hw));
      for (let x = x0; x < x1; x++) {
        const nx = (x - X) / R, rr = nx * nx + ny2; if (rr >= 1) continue;
        const z = Math.sqrt(1 - rr);
        const la = Math.asin(z * sp + ny * cp), lo = lam * D2R + Math.atan2(nx, z * cp - ny * sp);
        const u = ((lo / (2 * Math.PI) + 0.5) % 1 + 1) % 1, v = 0.5 - la / Math.PI;
        const ti = ((Math.min(TH - 1, (v * TH) | 0)) * TW + ((u * TW) | 0)) * 4, o = (y * W + x) * 4;
        const sh = 0.25 + 0.75 * Math.pow(z, 0.6);
        d[o] = tex[ti] * sh; d[o + 1] = tex[ti + 1] * sh; d[o + 2] = tex[ti + 2] * sh; d[o + 3] = 255;
      }
    }
  }
  cx.putImageData(img, 0, 0);
  const gl = cx.createRadialGradient(X, Y, R * 0.98, X, Y, R * 1.12);
  gl.addColorStop(0, "rgba(120,170,255,.55)"); gl.addColorStop(1, "rgba(120,170,255,0)");
  cx.fillStyle = gl; cx.beginPath(); cx.arc(X, Y, R * 1.12, 0, 7); cx.fill();
  const k = 1 / S.q;
  for (const { g, e } of cards) {   // a card per pin; it fades and shrinks as it turns away
    const f = g.lat * D2R, dl = (g.lon - lam) * D2R;
    const c = sp * Math.sin(f) + cp * Math.cos(f) * Math.cos(dl);
    if (c < 0.05) { e.style.display = "none"; continue; }
    const px = X + R * Math.cos(f) * Math.sin(dl), py = Y - R * (cp * Math.sin(f) - sp * Math.cos(f) * Math.cos(dl));
    cx.fillStyle = "#ffd34d"; cx.beginPath(); cx.arc(px, py, 3, 0, 7); cx.fill();
    e.style.display = "block"; e.style.opacity = Math.min(1, c * 2.2); e.style.zIndex = Math.round(c * 1000);
    const s = (0.55 + 0.45 * c) * Math.max(1, R * k / 450);
    e.style.transform = `translate(${px * k - e.offsetWidth / 2}px,${py * k - e.offsetHeight - 9}px) scale(${s})`;
  }
  requestAnimationFrame(draw);
}
requestAnimationFrame(draw);
let drag = null;
w.addEventListener("pointerdown", ev => { drag = { x: ev.clientX, y: ev.clientY, lam, phi }; spin = false;
  w.classList.add("drag"); w.setPointerCapture(ev.pointerId); });
w.addEventListener("pointermove", ev => { if (!drag || !S) return; const R = Math.min(cv.width, cv.height) * 0.42 * zoom / S.q;
  lam = drag.lam - (ev.clientX - drag.x) / R * R2D; phi = Math.max(-85, Math.min(85, drag.phi + (ev.clientY - drag.y) / R * R2D)); });
w.addEventListener("pointerup", () => { drag = null; w.classList.remove("drag"); });
w.addEventListener("dblclick", () => spin = !spin);
w.addEventListener("wheel", ev => { ev.preventDefault(); zoom = Math.max(0.6, Math.min(4, zoom * Math.exp(-ev.deltaY * 0.0015))); }, { passive: false });
</script></body></html>
